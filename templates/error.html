<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚗 Tesla Dashboard - Error</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --tesla-red: #e31937;
        --text-primary: #111827;
        --text-secondary: #6b7280;
        --error-red: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .error-container {
        background: white;
        border-radius: 20px;
        padding: 60px 40px;
        text-align: center;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1),
          0 4px 6px -4px rgb(0 0 0 / 0.1);
        max-width: 500px;
        width: 100%;
      }

      .error-icon {
        font-size: 4rem;
        color: var(--error-red);
        margin-bottom: 24px;
      }

      .error-title {
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 16px;
      }

      .error-message {
        color: var(--text-secondary);
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .error-details {
        background: #f9fafb;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 32px;
        text-align: left;
        font-family: "Monaco", "Menlo", "Ubuntu Mono", monospace;
        font-size: 0.9rem;
        color: var(--error-red);
        overflow-x: auto;
      }

      .action-buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--tesla-red), #c41230);
        color: white;
      }

      .btn-secondary {
        background: #f3f4f6;
        color: var(--text-primary);
        border: 1px solid #d1d5db;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1),
          0 4px 6px -4px rgb(0 0 0 / 0.1);
      }

      @media (max-width: 480px) {
        .error-container {
          padding: 40px 24px;
        }

        .error-title {
          font-size: 1.5rem;
        }

        .action-buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-icon">
        <i class="fas fa-exclamation-triangle"></i>
      </div>

      <h1 class="error-title">Oops! Something went wrong</h1>

      <p class="error-message">
        We encountered an error while loading your Tesla dashboard. This might
        be due to missing order data or authentication issues.
      </p>

      {% if error %}
      <div class="error-details">{{ error }}</div>
      {% endif %}

      <div class="action-buttons">
        <a href="/" class="btn btn-primary">
          <i class="fas fa-home"></i>
          Go to Dashboard
        </a>
        <button onclick="window.location.reload()" class="btn btn-secondary">
          <i class="fas fa-sync-alt"></i>
          Try Again
        </button>
      </div>
    </div>

    <script>
      // Auto-retry after 30 seconds
      setTimeout(() => {
        window.location.href = "/";
      }, 30000);
    </script>
  </body>
</html>
